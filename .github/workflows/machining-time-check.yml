name: Nightly machining-time check

# Re-reads every program's TruTops PDF sketch and corrects any
# operations.machining_time_seconds that has drifted from the printed
# "[h:min:s]" total. Self-healing; opens an issue only when it changes
# something or hits a PDF it can't read.

on:
  schedule:
    - cron: "30 21 * * *" # 21:30 UTC = 03:00 IST (Asia/Kolkata)
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pymupdf

      - id: run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          python scripts/verify-machining-time.py --apply | tee mt-out.txt
          {
            echo '## Machining-time check'
            echo '```'
            cat mt-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on changes / problems
        if: steps.run.outputs.applied != '0' || steps.run.outputs.ambiguous != '0' || steps.run.outputs.errors != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Machining-time check $(date +%F): ${{ steps.run.outputs.applied }} corrected" \
            --body-file mt-out.txt \
            --assignee "${{ github.repository_owner }}" || true
